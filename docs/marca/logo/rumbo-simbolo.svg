<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Rumbo — isotipo "La flecha". Fondo Lino Verde #F4F9F2 con aire generoso. -->
  <rect width="512" height="512" fill="#F4F9F2" />

  <defs>
    <linearGradient id="rumbo-aleta-simbolo" x1="0" y1="239" x2="0" y2="429" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#066B49" />
      <stop offset="1" stop-color="#0CC97D" />
    </linearGradient>
  </defs>

  <g stroke-linejoin="round">
    <!-- Hoja: Verde Impulso #17F296 — la direccion -->
    <path d="M 347 128 L 372 261 L 172 308 L 136 237 Z" fill="#17F296" stroke="#17F296" stroke-width="72" />
    <!-- Aleta: Verde Rumbo -> Verde Brote — la base -->
    <path d="M 377 279 L 259 389 L 257 282 Z" fill="url(#rumbo-aleta-simbolo)" stroke="url(#rumbo-aleta-simbolo)" stroke-width="63" />
  </g>
</svg>
