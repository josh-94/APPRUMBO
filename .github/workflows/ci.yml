name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci && npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.base }}/api:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.base }}/worker:latest
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.base }}/web:latest
      - name: Deploy on the home server
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          IMAGE_BASE: ${{ steps.image.outputs.base }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hoy
          chmod 600 ~/.ssh/hoy
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/hoy "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH/deploy'"
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/hoy deploy/compose.yaml "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/deploy/compose.yaml"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/hoy "$SSH_USER@$SSH_HOST" "bash -s" <<EOF
          set -euo pipefail
          cd '$DEPLOY_PATH'
          printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          export HOY_API_IMAGE='$IMAGE_BASE/api:latest'
          export HOY_WORKER_IMAGE='$IMAGE_BASE/worker:latest'
          export HOY_WEB_IMAGE='$IMAGE_BASE/web:latest'
          docker compose --env-file deploy/.env -f deploy/compose.yaml --profile tunnel pull
          docker compose --env-file deploy/.env -f deploy/compose.yaml --profile tunnel up -d
          EOF
