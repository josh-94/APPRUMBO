# RUMBO en la placa. El uso está en el README.
# Copiar deploy/.env.example a deploy/.env y cambiar contraseñas.
# Llaves de notificaciones: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm --no-deps api vapid
# Túnel de Cloudflare: mi.apprumbo.online y apprumbo.online -> http://web:80
# www.apprumbo.online redirige al apex. app.codewithjosh.codes ya no se publica.
# Arranque local: docker compose --env-file deploy/.env -f deploy/compose.yaml --profile local up --build
# Arranque con túnel: docker compose --env-file deploy/.env -f deploy/compose.yaml --profile tunnel up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hoy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoy}
      POSTGRES_DB: hoy
    command: postgres -c shared_buffers=128MB -c max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoy -d hoy"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    mem_limit: 96m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${HOY_API_IMAGE:-hoy-api:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: .env
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  worker:
    image: ${HOY_WORKER_IMAGE:-hoy-worker:local}
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  web:
    image: ${HOY_WEB_IMAGE:-hoy-web:local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "8088:80"
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  pgweb:
    image: sosedoff/pgweb:0.16.2
    profiles: ["local"]
    command: ["--bind=0.0.0.0", "--listen=8081", "--url", "postgres://hoy:${POSTGRES_PASSWORD:-hoy}@postgres:5432/hoy?sslmode=disable"]
    ports:
      - "127.0.0.1:8081:8081"
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  api-py:
    profiles: ["python"]
    image: ${HOY_API_PY_IMAGE:-hoy-api-py:local}
    build:
      context: ..
      dockerfile: apps/api-py/Dockerfile
    env_file: .env
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  worker-py:
    profiles: ["python"]
    image: ${HOY_WORKER_PY_IMAGE:-hoy-worker-py:local}
    build:
      context: ..
      dockerfile: apps/worker-py/Dockerfile
    env_file: .env
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      api-py:
        condition: service_healthy

  web-flutter:
    profiles: ["python"]
    image: ${HOY_WEB_FLUTTER_IMAGE:-hoy-web-flutter:local}
    build:
      context: ../apps/web-flutter
      dockerfile: Dockerfile
    ports:
      - "8090:80"
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      api-py:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      - web

volumes:
  pgdata:
