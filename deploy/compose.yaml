# RUMBO en la placa. El uso está en el README.
# Consola, por SSH: deploy/scripts/rumbo  (gui, publicar, usuarios, estado)
# Copiar deploy/.env.example a deploy/.env y cambiar contraseñas.
# Llaves de notificaciones: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm --no-deps api vapid
# Túnel de Cloudflare: mi.apprumbo.online y apprumbo.online -> http://web:80
# www.apprumbo.online redirige al apex. app.codewithjosh.codes ya no se publica.
# Arranque local: docker compose --env-file deploy/.env -f deploy/compose.yaml --profile local up --build
# Arranque con túnel: docker compose --env-file deploy/.env -f deploy/compose.yaml --profile tunnel up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hoy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoy}
      POSTGRES_DB: hoy
    command: postgres -c shared_buffers=128MB -c max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoy -d hoy"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    mem_limit: 96m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${HOY_API_IMAGE:-hoy-api:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-gemma3:1b}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-4}
      WHISPER_URL: ${WHISPER_URL:-}
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  worker:
    image: ${HOY_WORKER_IMAGE:-hoy-worker:local}
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  web:
    image: ${HOY_WEB_IMAGE:-hoy-web:local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "8088:80"
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  pgweb:
    image: sosedoff/pgweb:0.16.2
    profiles: ["local"]
    command: ["--bind=0.0.0.0", "--listen=8081", "--url", "postgres://hoy:${POSTGRES_PASSWORD:-hoy}@postgres:5432/hoy?sslmode=disable"]
    ports:
      - "127.0.0.1:8081:8081"
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      - web

  # Fallback local (última instancia si Groq falla). Sin puertos publicados.
  # gemma3:1b ~1 GiB; tope holgado en placa de 8 GB. Sin Whisper ni VL.
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_FLASH_ATTENTION: "1"
    volumes:
      - ollamadata:/root/.ollama
    mem_limit: 2048m
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-gemma3:1b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until ollama list >/dev/null 2>&1; do
          i=$$((i+1))
          if [ "$$i" -gt 90 ]; then echo "ollama no respondió"; exit 1; fi
          sleep 2
        done
        ollama pull "$$OLLAMA_TEXT_MODEL"
        # Carga el modelo en RAM para que el fallback no pague cold-load.
        ollama run "$$OLLAMA_TEXT_MODEL" "."
    mem_limit: 128m
    restart: on-failure
    depends_on:
      - ollama

volumes:
  pgdata:
  ollamadata:
