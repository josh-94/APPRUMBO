server {
    listen 80 default_server;
    server_name mi.apprumbo.online _;
    root /usr/share/nginx/html;

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /favicon.ico {
        add_header Cache-Control "no-cache";
        return 302 /logo.svg;
    }

    location = /privacidad {
        try_files /privacidad.html =404;
    }

    location = /condiciones {
        try_files /condiciones.html =404;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name apprumbo.online;
    root /usr/share/nginx/landing;

    location = /sw.js {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /favicon.ico {
        return 302 /logo.svg;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
