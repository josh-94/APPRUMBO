<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tareas, rutinas y el día de hoy">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hoy">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hoy</title>
</head>
<body>
  <script>
    function hoyKeyBytes(value) {
      const padding = '='.repeat((4 - (value.length % 4)) % 4)
      const base64 = (value + padding).replace(/-/g, '+').replace(/_/g, '/')
      const raw = atob(base64)
      const out = new Uint8Array(raw.length)
      for (let i = 0; i < raw.length; i += 1) out[i] = raw.charCodeAt(i)
      return out
    }
    window.hoyEnablePush = async (publicKey) => {
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent)
      const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true
      if (ios && !standalone) {
        throw new Error('En el iPhone, primero añade Hoy a la pantalla de inicio y ábrelo desde el icono')
      }
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        throw new Error('Este navegador no puede recibir notificaciones')
      }
      const ready = await navigator.serviceWorker.ready
      const permission = await Notification.requestPermission()
      if (permission !== 'granted') throw new Error('Permiso de notificaciones denegado')
      const subscription = await ready.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: hoyKeyBytes(publicKey),
      })
      const json = subscription.toJSON()
      return JSON.stringify({
        endpoint: subscription.endpoint,
        p256dh: json.keys.p256dh,
        auth: json.keys.auth,
      })
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'))
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
